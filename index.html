<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="theme-color" content="#0b0f0e"/>
<title>الري الذكي | PRO Dashboard</title>
<style>
:root{--g:#10b981;--gd:#059669;--dark:#0b0f0e;--bg:#f5f6f7;--card:#fff;--txt:#1f2937;--mut:#9ca3af;--r:#ef4444;--b:#3b82f6}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,sans-serif}
body{display:flex;min-height:100vh;background:var(--bg);color:var(--txt)}
aside{width:250px;background:var(--dark);background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:30px 30px;color:#fff;padding:20px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:30px}
.logo .ic{width:44px;height:44px;background:var(--g);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px}
.logo b{font-size:17px}.logo small{display:block;color:var(--g);font-size:10px;letter-spacing:1px}
nav{flex:1}
.ni{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;color:#9ca3af;cursor:pointer;font-size:14px;font-weight:bold;margin-bottom:4px;transition:.2s}
.ni:hover{color:#fff}
.ni.on{background:var(--g);color:#fff;box-shadow:0 4px 14px rgba(16,185,129,.4)}
.stat{background:linear-gradient(135deg,#06281e,#0b0f0e);border:1px solid rgba(16,185,129,.25);border-radius:14px;padding:12px;font-size:12px;cursor:pointer}
.stat b{display:flex;align-items:center;gap:6px}
.stat i{width:8px;height:8px;border-radius:50%;background:var(--g);display:inline-block}
.stat small{color:var(--mut);display:block;margin-top:4px}
main{flex:1;padding:26px 30px;overflow-y:auto}
h1{color:var(--g);font-size:26px}
.sub{color:var(--mut);font-size:13px;margin:4px 0 20px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:20px}
.card{background:var(--card);border-radius:18px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.card .t{display:flex;align-items:center;gap:8px;font-weight:bold;font-size:14px}
.card .ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px}
.big{font-size:30px;font-weight:800;margin:8px 0 4px}
.pill{display:inline-block;padding:5px 12px;border-radius:14px;font-size:11px;font-weight:bold}
.pill.g{background:#d1fae5;color:var(--gd)}.pill.r{background:#fee2e2;color:var(--r)}
.bar{height:7px;background:#e5e7eb;border-radius:5px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--g);border-radius:5px;transition:width .6s}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:16px}
@media(max-width:900px){body{flex-direction:column}aside{width:100%;height:auto;flex-direction:row;align-items:center;overflow-x:auto}nav{display:flex}main{padding:16px}.grid2{grid-template-columns:1fr}}
.bars{display:flex;align-items:flex-end;gap:14px;height:220px;padding:10px 4px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bcol .b{width:70%;max-width:52px;background:linear-gradient(180deg,var(--g),#a7f3d0);border-radius:8px 8px 4px 4px;transition:height .8s}
.bcol small{color:var(--mut);font-size:11px}
.wcard{background:linear-gradient(135deg,#2563eb,#06b6d4);color:#fff;border-radius:22px;padding:26px}
.wcard .tmp{font-size:64px;font-weight:800}
.wrow{display:flex;justify-content:space-between;margin-top:18px;border-top:1px solid rgba(255,255,255,.25);padding-top:14px;font-size:13px}
.fcard{background:#fff;border-radius:16px;padding:14px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.fcard .e{font-size:30px}
.btn{border:none;border-radius:12px;padding:12px 18px;font-weight:bold;cursor:pointer;font-size:14px;transition:.15s}
.btn:active{transform:scale(.97)}
.btn.g{background:var(--g);color:#fff}.btn.o{background:#fff;color:var(--txt);border:1px solid #e5e7eb}
.btn.r{background:var(--r);color:#fff}
.btn.sm{padding:8px 14px;font-size:12px;border-radius:10px}
.tgl{display:flex;background:#e5e7eb;border-radius:14px;padding:4px;width:fit-content;margin-bottom:12px}
.tgl div{padding:9px 18px;border-radius:11px;font-size:13px;font-weight:bold;color:var(--mut);cursor:pointer}
.tgl div.on{background:#fff;color:var(--gd);box-shadow:0 2px 8px rgba(0,0,0,.1)}
.nitem{display:flex;gap:14px;align-items:center;background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.nitem .ic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.nitem .tm{margin-inline-start:auto;background:#f3f4f6;padding:4px 10px;border-radius:10px;font-size:11px;color:var(--mut);white-space:nowrap}
.nitem.unread::after{content:'';width:9px;height:9px;background:var(--g);border-radius:50%;flex-shrink:0}
